<svg viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Outbound Intelligence pipeline, radial view: n8n orchestrates Apollo sourcing, Clay enrichment and scoring, Notion CRM records, an automatic Gmail send for hot-tier leads, a manual LinkedIn and call queue for other tiers, and Looker Studio analytics.">
  <rect width="700" height="700" fill="#ffffff"/>

  <circle cx="350" cy="350" r="230" fill="none" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="3 7"/>
  <circle cx="350" cy="350" r="92" fill="#2563eb" opacity="0.06"/>

  <!-- spokes -->
  <line x1="350" y1="294" x2="350" y2="150" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="398.5" y1="322" x2="523.1" y2="250" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="398.5" y1="378" x2="523.1" y2="450" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="350" y1="406" x2="350" y2="550" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="301.5" y1="378" x2="176.9" y2="450" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 6"/>
  <line x1="301.5" y1="322" x2="176.9" y2="250" stroke="#cbd5e1" stroke-width="2"/>

  <!-- hub -->
  <circle cx="350" cy="350" r="56" fill="#2563eb"/>
  <text x="350" y="345" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff">n8n</text>
  <text x="350" y="364" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" letter-spacing="0.06em" fill="#dbeafe">ORCHESTRATOR</text>

  <!-- Apollo (top) -->
  <circle cx="350" cy="120" r="30" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <g transform="translate(340,110)" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6"/><line x1="17" y1="17" x2="12.5" y2="12.5"/>
  </g>
  <text x="350" y="72" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Apollo.io</text>
  <text x="350" y="170" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="0.05em" fill="#94a3b8">SOURCE</text>

  <!-- Clay (upper right) -->
  <circle cx="549.1" cy="235" r="30" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <g transform="translate(539.1,225)" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 1l7 5.5-7 12-7-12z"/>
  </g>
  <text x="549.1" y="187" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Clay</text>
  <text x="549.1" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="0.05em" fill="#94a3b8">ENRICH + SCORE</text>

  <!-- Notion (lower right) -->
  <circle cx="549.1" cy="465" r="30" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <g transform="translate(539.1,455)" fill="none" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="1" width="16" height="18" rx="2"/><line x1="6" y1="7" x2="14" y2="7"/><line x1="6" y1="11" x2="14" y2="11"/><line x1="6" y1="15" x2="11" y2="15"/>
  </g>
  <text x="549.1" y="513" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Notion</text>
  <text x="549.1" y="533" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="0.05em" fill="#94a3b8">CRM RECORD</text>

  <!-- Gmail (bottom) -->
  <circle cx="350" cy="580" r="30" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
  <g transform="translate(340,571)" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="2" width="18" height="14" rx="2"/><path d="M1 4l9 6 9-6"/>
  </g>
  <text x="350" y="628" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Gmail</text>
  <text x="350" y="648" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="0.05em" fill="#b45309">HOT-TIER AUTO-SEND</text>

  <!-- LinkedIn/Call (lower left) -->
  <circle cx="150.9" cy="465" r="30" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <g transform="translate(140.9,455)" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="1" width="18" height="18" rx="2"/><line x1="5" y1="7" x2="15" y2="7"/><line x1="5" y1="11" x2="15" y2="11"/><line x1="5" y1="15" x2="11" y2="15"/>
  </g>
  <text x="150.9" y="513" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">LinkedIn / Call</text>
  <text x="150.9" y="533" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="0.05em" fill="#94a3b8">MANUAL QUEUE</text>

  <!-- Looker (upper left) -->
  <circle cx="150.9" cy="235" r="30" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <g transform="translate(140.9,225)" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="1" y1="19" x2="19" y2="19"/><rect x="4" y="12" width="3" height="7"/><rect x="9" y="8" width="3" height="11"/><rect x="14" y="4" width="3" height="15"/>
  </g>
  <text x="150.9" y="187" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Looker</text>
  <text x="150.9" y="285" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" letter-spacing="0.05em" fill="#94a3b8">ANALYTICS</text>
</svg>
